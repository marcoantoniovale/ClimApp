[project]
name = "climapp-etl"
version = "0.1.0"
description = "Ingesta y procesamiento de datos meteorológicos de ClimApp"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "tzdata",  # zonas horarias en Windows (America/Santiago)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
