# Temporal: diagnóstico de conectividad desde GitHub Actions hacia las fuentes. Se elimina tras usarlo.
name: Diagnostico
on:
  push:
    paths: [".github/workflows/diagnostico.yml"]
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: IP de salida
        run: curl -s --max-time 15 https://ipinfo.io/json | grep -E '"(ip|country|org)"' || true
      - name: Directemar y Open-Meteo
        run: |
          for u in \
            https://serviciosonline.directemar.cl/meteomapa/api/meteo/mapa \
            https://serviciosonline.directemar.cl/meteomapa/api/meteo/observaciones/directemar \
            https://serviciosonline.directemar.cl/meteomapa/ \
            https://meteoarmada.directemar.cl/ \
            https://www.directemar.cl/ \
            "https://api.open-meteo.com/v1/forecast?latitude=-33&longitude=-71&current=temperature_2m"; do
            for intento in 1 2; do
              curl -s -o /dev/null --max-time 30 -w "$u intento=$intento -> HTTP %{http_code} %{time_total}s %{errormsg}\n" "$u" || true
            done
          done
