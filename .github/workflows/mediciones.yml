# Ingesta liviana de ClimApp cada 15 minutos (código en ClimAppWeb/etl): lluvia medida en las
# estaciones DMC → Redis `lluvia` y renovación de la web. La ingesta completa sigue cada hora (ingesta.yml).
#
# Disparo principal: Supabase (pg_cron, migración 0015) a los minutos 14, 29 y 44; el "schedule" de GitHub
# es solo respaldo (en este repositorio casi no dispara).
#
# Solo corre si la variable del repositorio MEDICIONES_15MIN vale "si" (Settings → Secrets and variables →
# Actions → Variables), también cuando lo dispara Supabase. Activarla solo con el repositorio público: en
# uno privado cada corrida descuenta minutos de GitHub Actions (~2.200 min/mes). Un job omitido no consume
# minutos. A mano: "Run workflow" con "forzar" marcado corre aunque la variable no esté.
#
# Nota: GitHub solo ejecuta los "schedule" del archivo que está en la rama por defecto (main).

name: Mediciones

on:
  schedule:
    - cron: "14,29,44 * * * *"   # entre las horarias (minuto 59)
  workflow_dispatch:
    inputs:
      forzar:
        description: "Correr aunque MEDICIONES_15MIN no valga \"si\""
        type: boolean
        default: false

concurrency:
  group: mediciones
  cancel-in-progress: false

jobs:
  mediciones:
    if: vars.MEDICIONES_15MIN == 'si' || inputs.forzar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ClimAppWeb/etl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ClimAppWeb/etl/pyproject.toml

      - name: Instalar ETL
        run: pip install -e .

      - name: Ejecutar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: python -m climapp_etl mediciones
