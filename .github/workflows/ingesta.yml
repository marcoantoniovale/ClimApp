# Ingesta horaria de ClimApp (código en ClimAppWeb/etl).
# El modo "auto" decide qué corresponde: descarga ICON (y GFS para UV/visibilidad) solo cuando Open-Meteo
# publicó una corrida nueva (tabla model_runs), avisos cada hora, archivo cada 12 h, mantención
# cada 24 h. Si se ejecuta dos veces seguidas, la segunda no descarga nada.
#
# Ojo: el cron de GitHub se retrasa o salta corridas (2026-10-01: ninguna en las primeras 2 h).
#
# Las observaciones de la Armada NO se recolectan aquí: su API bloquea las IP de GitHub Actions
# (Azure) y de AWS (verificado el 2026-10-01). Se recolectan desde un equipo en Chile.
#
# Nota: GitHub solo ejecuta los "schedule" del archivo que está en la rama por defecto (main).

name: Ingesta

on:
  schedule:
    - cron: "59 * * * *"          # respaldo: minuto 59 (el disparador principal es Supabase, también al 59)
  workflow_dispatch:
    inputs:
      comando:
        description: "Comando del ETL"
        type: choice
        options: [auto, observaciones, pronostico, archivo, avisos, pasos, dmc, dmc_historial, dmc_lluvia, correccion, residuos, precalculo, localidades, mantencion]
        default: auto
  push:
    paths: [".github/workflows/ingesta.yml"]   # prueba al modificar este archivo

permissions:
  contents: write        # respaldo de los datos en la etiqueta `datos` (scripts/publicar_respaldo.sh)

concurrency:
  group: ingesta
  cancel-in-progress: false

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ClimAppWeb/etl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ClimAppWeb/etl/pyproject.toml

      - name: Instalar ETL
        run: pip install -e .

      - name: Ejecutar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CLIMAPP_RESPALDO_DIR: ${{ runner.temp }}/respaldo
        run: python -m climapp_etl ${{ inputs.comando || 'auto' }} ${{ (inputs.comando || 'auto') == 'auto' && '--sin-observaciones' || '' }}

      # Aunque la ingesta falle (p. ej. Upstash sin servicio): lo que alcanzó a generar queda en GitHub.
      - name: Respaldo de los datos (etiqueta datos)
        id: respaldo
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publicar_respaldo.sh "${{ runner.temp }}/respaldo"

      # La web lee los pronósticos por ubicación desde ese commit (clave global `respaldo` en Redis) y se renueva.
      - name: Publicar la versión del respaldo y renovar la web
        if: always() && steps.respaldo.outputs.sha != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CLIMAPP_RESPALDO_SHA: ${{ steps.respaldo.outputs.sha }}
        run: python -m climapp_etl respaldo_publicado
